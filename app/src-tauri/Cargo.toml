[package]
name = "larafim-app"
description = "Larafim — gerenciador local de PHP, Node e serviços"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "larafim_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
larafim-core.workspace = true
larafim-runtimes.workspace = true
larafim-server.workspace = true
tokio = { version = "1", features = ["time", "sync"] }
semver = "1"
base64 = "0.23"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_Globalization", "Win32_Storage_Packaging_Appx", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }
