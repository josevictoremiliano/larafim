# Publica uma versão: ao enviar uma tag `vX.Y.Z`, compila o instalador do
# Windows, gera o SHA-256 e a atestação de origem (provenance) e cria um
# publica a release no GitHub com os arquivos.
#
#   git tag v0.1.0
#   git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já existente para (re)compilar, ex.: v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Instalador do Windows
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write # publicar a release
      id-token: write # atestação de origem
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: A tag bate com a versão do app
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            Write-Error "A tag $env:TAG não bate com a versão $version em tauri.conf.json"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dependências da interface
        working-directory: app
        run: npm ci

      - name: Testes antes de publicar
        shell: pwsh
        run: |
          node scripts/i18n.mjs check --strict
          Push-Location app; npm run build; Pop-Location
          cargo build -p larafim-shim --release --locked
          cargo test --workspace --locked

      # A chave pública do updater precisa estar no tauri.conf.json, senão
      # o app publicado não consegue conferir as próximas atualizações.
      - name: Chave do updater configurada
        shell: pwsh
        run: |
          $pubkey = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if (-not $pubkey -or $pubkey -eq "CHAVE_PUBLICA_DO_UPDATER") {
            Write-Error "plugins.updater.pubkey não configurada (veja docs/desenvolvimento/publicar-versao.md)"
            exit 1
          }

      # `tauri build` roda o beforeBuildCommand (traduções do instalador,
      # larafim-shim e interface) e gera o instalador NSIS. Com a chave
      # privada do updater ele também gera o `.sig` do instalador, que o app
      # confere antes de atualizar.
      - name: Compilar o instalador
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      # Pacote da Microsoft Store, sem assinatura (a Store assina). Não vai
      # para a release: sem assinatura ele não instala fora da Store. Baixe
      # em Actions › esta execução › Artifacts e envie pelo Partner Center.
      - name: Pacote MSIX (Microsoft Store)
        shell: pwsh
        run: ./scripts/msix.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: larafim-msix-${{ env.TAG }}
          path: target/msix/*.msix
          if-no-files-found: error

      - name: SHA-256 do instalador
        id: files
        shell: pwsh
        run: |
          $dir = "target/release/bundle/nsis"
          $exe = Get-ChildItem $dir -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "instalador não encontrado em $dir"; exit 1 }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$dir/SHA256SUMS.txt"
          "installer=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sums=$((Resolve-Path "$dir/SHA256SUMS.txt").Path)" >> $env:GITHUB_OUTPUT

      # latest.json: o que o Larafim instalado consulta para se atualizar
      # (releases/latest/download/latest.json). Aponta para o instalador
      # desta release e leva a assinatura do `.sig`.
      - name: Manifesto de atualização
        id: updater
        shell: pwsh
        env:
          INSTALLER: ${{ steps.files.outputs.installer }}
        run: |
          $sig = "$env:INSTALLER.sig"
          if (-not (Test-Path $sig)) { Write-Error "assinatura do updater não gerada: $sig (secret TAURI_SIGNING_PRIVATE_KEY?)"; exit 1 }
          $name = Split-Path -Leaf $env:INSTALLER
          $manifest = [ordered]@{
            version   = $env:TAG.TrimStart('v')
            notes     = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$name"
              }
            }
          }
          $out = Join-Path (Split-Path $env:INSTALLER) "latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8NoBOM $out
          "sig=$sig" >> $env:GITHUB_OUTPUT
          "manifest=$out" >> $env:GITHUB_OUTPUT

      - name: Atestação de origem
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.files.outputs.installer }}

      # Texto da release: a seção da versão no CHANGELOG.md + como instalar e
      # conferir o download. A lista de PRs (agrupada por .github/release.yml)
      # vem logo depois, gerada pelo GitHub.
      - name: Notas da release
        id: notes
        shell: pwsh
        env:
          INSTALLER: ${{ steps.files.outputs.installer }}
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $section = @(); $inside = $false
          foreach ($l in $lines) {
            if ($l -match '^## ') { $inside = ($l.Trim() -eq "## $env:TAG"); continue }
            if ($inside) { $section += $l }
          }
          if (-not ($section -join '').Trim()) {
            Write-Error "CHANGELOG.md não tem a seção '## $env:TAG'"
            exit 1
          }
          $exe = Split-Path -Leaf $env:INSTALLER
          $hash = (Get-FileHash $env:INSTALLER -Algorithm SHA256).Hash.ToLower()
          $install = @(
            '', '### Instalar', '',
            "1. Baixe o **``$exe``** em *Assets*, logo abaixo.",
            '2. Confira o download (opcional, recomendado):',
            '   ```powershell',
            "   Get-FileHash .\$exe -Algorithm SHA256",
            "   # $hash",
            "   gh attestation verify .\$exe --repo $env:GITHUB_REPOSITORY",
            '   ```',
            '3. Rode o instalador. Ele instala só para o seu usuário, sem administrador.',
            '', 'Já tem o Larafim? Ele mesmo se atualiza: *Configurações › Sobre › Atualizar e reiniciar*.', ''
          )
          ($section + $install) -join "`n" | Out-File -Encoding utf8 notes.md
          "path=$((Resolve-Path notes.md).Path)" >> $env:GITHUB_OUTPUT

      - name: Publicar a release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Larafim ${{ env.TAG }}
          draft: false
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            ${{ steps.files.outputs.installer }}
            ${{ steps.files.outputs.sums }}
            ${{ steps.updater.outputs.sig }}
            ${{ steps.updater.outputs.manifest }}
